{% set name = "webassets" %}
{% set version = "3.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/webassets-{{ version }}.tar.gz
  sha256: 0520e5fd6fbcc012f486fefc61b966474da8fc1b35b0569a9ec2cb0782f1607a

build:
  entry_points:
    - webassets = webassets.script:run
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - sphinx
    - pip
    - setuptools
  run:
    - pyyaml >=6.0.2
    - zope-dottedname >=6.0
    - python >={{ python_min }}
    # - zope-dottedname >=6.0
    # - slimit >=0.8.1
    # - rcssmin >=1.1.2
    # - pyyaml >=6.0.2
    # - ply >=3.11
    # - libsass >=0.23.0
    # - jinja2 >=3.1.4
    # - cssutils >=2.11.1
    # - closure >=20191111

test:
  imports:
    - webassets
    - webassets.ext
    - webassets.filter
    - webassets.filter.cssrewrite
    - webassets.filter.jspacker
    - webassets.filter.rjsmin
  commands:
    - pip check
    - webassets --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/miracle2k/webassets/
  license: BSD-2-Clause
  license_file: LICENSE
  license_family: BSD
  summary: 'Media asset management for Python, with glue code for various web frameworks'
  doc_url: https://webassets.readthedocs.io/
  dev_url: https://github.com/miracle2k/webassets/

extra:
  recipe-maintainers:
    - rxm7706
    - pmlandwehr
